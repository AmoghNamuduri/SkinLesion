# ---------------------------------------------------------------------------
# Paper-faithful configuration for
#   Shetty et al., "Skin lesion classification of dermoscopic images using
#   machine learning and convolutional neural network", Sci Rep 12:18134 (2022)
#
# Every number below is taken from the paper (section / table noted) or, where
# the paper is silent, from the public tutorials its pipeline is built on
# (marked "assumed").  Create a new YAML with `base: paper.yaml` to run a
# variation — do not edit this file.
# ---------------------------------------------------------------------------

seed: 42

paths:
  raw_dir: data/raw                 # downloaded zips + extracted images + metadata
  organized_dir: data/organized     # Step 1: one folder per diagnosis (all 10,015 images)
  subset_dir: data/subset           # 100 sampled images per class
  features_file: data/features/global_features.h5
  outputs_dir: outputs

download:
  source: dataverse                 # dataverse (no login) | kaggle (needs ~/.kaggle/kaggle.json)
  dataverse_doi: doi:10.7910/DVN/DBW86T
  kaggle_dataset: kmader/skin-cancer-mnist-ham10000

data:
  # Alphabetical order == LabelBinarizer order == Table 7 row order (0-akiec … 6-vasc)
  classes: [akiec, bcc, bkl, df, mel, nv, vasc]
  class_names:
    akiec: Actinic keratoses
    bcc: Basal cell carcinoma
    bkl: Benign keratosis-like lesions
    df: Dermatofibroma
    mel: Melanoma
    nv: Melanocytic nevi
    vasc: Vascular lesions
  images_per_class: 100             # Step 1: "choosing 100 images per class" (df has only 115)
  sampling_seed: 42                 # assumed
  hflip_augmentation: true          # Step 3: horizontal flip -> 200 images per class
  # The paper augments BEFORE splitting, so a flipped twin of a test image can
  # sit in the training set. true = paper-faithful; false = leakage-free split.
  augment_before_split: true

ml:                                  # Section "Feature extraction" + Table 1
  image_size: 220                   # Step 2: "resized to 220*220"
  histogram_bins: 8                 # assumed: 8x8x8 HSV histogram (512-d)
  scaler: minmax                    # assumed: MinMaxScaler(0,1) on all features
  test_size: 0.2                    # 80 / 20 split
  split_seed: 9                     # assumed (tutorial default)
  kfold: 10                         # "10-fold cross-validation"
  kfold_seed: 9
  models:                           # Table 1
    LR:  {class: LogisticRegression, params: {random_state: 9}}
    LDA: {class: LinearDiscriminantAnalysis, params: {solver: svd}}
    KNN: {class: KNeighborsClassifier, params: {n_neighbors: 5}}
    DT:  {class: DecisionTreeClassifier, params: {random_state: 9}}   # paper lists "Estimators = 100" (not a DT parameter)
    RF:  {class: RandomForestClassifier, params: {n_estimators: 200, random_state: 0}}
    NB:  {class: GaussianNB, params: {var_smoothing: 1.0e-9}}
    SVM: {class: SVC, params: {kernel: linear, C: 1, random_state: 0}}

cnn:                                 # Tables 2 & 3
  image_size: 96                    # "scaled to 96 x 96 with a depth of 3"
  test_size: 0.2
  split_seed: 42                    # assumed
  epochs: 150
  batch_size: 32
  learning_rate: 0.001
  lr_decay: 0.00001                 # Keras-style decay = lr/epochs  (Table 3: "0.001–0.00001")
  optimizer: adam
  device: auto                      # auto | cpu | cuda
  num_workers: 0
  architecture:                     # Table 2
    conv_blocks:
      - {filters: [32], pool: 3, dropout: 0.25}
      - {filters: [64, 64], pool: 2, dropout: 0.25}
      - {filters: [128, 128], pool: 2, dropout: 0.25}
    dense_units: 1024
    dense_dropout: 0.5
    batch_norm: true
  augmentation:                     # Keras ImageDataGenerator settings (assumed, standard values)
    rotation_range: 25              # degrees
    width_shift_range: 0.1
    height_shift_range: 0.1
    shear_range: 0.2                # degrees (Keras semantics)
    zoom_range: 0.2
    horizontal_flip: true
    fill_mode: nearest
